  <text x="198" y="129" fill="#3483fa" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">ETIQUETAS 2/3 A4</text>
  <text x="198" y="181" fill="#17202a" font-family="Arial, sans-serif" font-size="42" font-weight="700">Prepará etiquetas para papel reutilizado</text>
  <text x="198" y="216" fill="#536471" font-family="Arial, sans-serif" font-size="22">Dos etiquetas por hoja A4 y el último tercio libre.</text>

  <text x="640" y="414" fill="#1769d4" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700">Seleccionar o arrastrar PDF</text>
  <text x="640" y="447" fill="#667784" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">El archivo se procesa sólo en este navegador.</text>
  <rect x="198" y="558" width="884" height="116" rx="18" fill="#fbfdff" stroke="#d9e5ed" stroke-width="2"/>
  <text x="234" y="608" fill="#17202a" font-family="Arial, sans-serif" font-size="27" font-weight="700">2. Generá el PDF listo para imprimir</text>
